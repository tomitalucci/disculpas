<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tengo algo que decirte 🥺</title>
  <meta name="description" content="Un mensaje muy importante (y un poquito arrepentido). Abrilo, porfa 🙏" />
  <!-- Vista previa en WhatsApp -->
  <meta property="og:title" content="Tengo algo que decirte 🥺" />
  <meta property="og:description" content="Abrilo, porfa 🙏 (no es spam, lo juro)" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#ff8fb1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Los textos se completan desde config.js — editalos ahí, no acá -->
  <div class="bg-hearts" id="bg-hearts" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main>
    <!-- Pantalla 1: el sobre -->
    <section class="screen active" id="screen-sobre">
      <div class="card">
        <div class="big-emoji wiggle" id="sobre-emoji"></div>
        <h2 id="sobre-titulo"></h2>
        <p class="muted" id="sobre-subtitulo"></p>
        <button class="btn btn-primary" id="btn-abrir"></button>
      </div>
    </section>

    <!-- Pantalla 2: el pedido de perdón -->
    <section class="screen" id="screen-perdon">
      <div class="card">
        <div class="big-emoji bounce" id="cara"></div>
        <h1 id="perdon-titulo"></h1>
        <div id="perdon-parrafos"></div>

        <div class="meter">
          <div class="meter-label">
            <span id="meter-texto"></span>
            <span id="meter-value">0%</span>
          </div>
          <div class="meter-bar"><div class="meter-fill" id="meter-fill"></div></div>
        </div>

        <h2 class="pregunta" id="pregunta"></h2>
        <div class="buttons" id="buttons">
          <button class="btn btn-si" id="btn-si"></button>
          <button class="btn btn-no" id="btn-no"></button>
        </div>
        <p class="pista" id="pista" aria-live="polite"></p>
      </div>
    </section>

    <!-- Pantalla 3: festejo -->
    <section class="screen" id="screen-si">
      <div class="card">
        <div class="big-emoji bounce" id="festejo-emoji"></div>
        <h1 id="festejo-titulo"></h1>
        <p id="resumen-intentos"></p>

        <div class="certificado">
          <div class="cert-title" id="cert-titulo"></div>
          <p class="cert-sub" id="cert-intro"></p>
          <ol id="cert-clausulas"></ol>
          <p class="cert-firma" id="cert-firma"></p>
          <div class="sello" id="sello"></div>
        </div>

        <div class="acciones">
          <button class="btn btn-ghost" id="btn-confeti"></button>
        </div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
